# Static site — no build step. Netlify publishes this folder as-is.
[build]
  publish = "."

# Old multi-page URLs from version 1 → their new chapters on the home page
[[redirects]]
  from = "/about"
  to = "/#identity"
  status = 301
[[redirects]]
  from = "/about.html"
  to = "/#identity"
  status = 301
[[redirects]]
  from = "/projects"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/projects.html"
  to = "/#work"
  status = 301
[[redirects]]
  from = "/services"
  to = "/#capabilities"
  status = 301
[[redirects]]
  from = "/services.html"
  to = "/#capabilities"
  status = 301
[[redirects]]
  from = "/resume"
  to = "/#journey"
  status = 301
[[redirects]]
  from = "/resume.html"
  to = "/#journey"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
